plugins {
    id 'com.android.application'
}

android {
    namespace 'it.example.passolibero'
    compileSdk 35

    defaultConfig {
        applicationId 'it.example.passolibero'
        minSdk 30
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
// Nessuna dipendenza esterna: solo Android SDK e Java standard.
