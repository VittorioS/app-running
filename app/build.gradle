plugins {
    id 'com.android.application'
}

def ciRun = System.getenv('GITHUB_RUN_NUMBER')
def debugKeyPath = System.getenv('PASSOLIBERO_DEBUG_KEYSTORE')

android {
    namespace 'it.example.passolibero'
    compileSdk 35

    defaultConfig {
        applicationId 'it.example.passolibero'
        minSdk 30
        targetSdk 35
        versionCode ciRun ? 10000 + Integer.parseInt(ciRun) : 2
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
    signingConfigs {
        if (debugKeyPath) {
            stableDebug {
                storeFile file(debugKeyPath)
                storeType 'PKCS12'
                storePassword System.getenv('PASSOLIBERO_DEBUG_STORE_PASSWORD')
                keyAlias System.getenv('PASSOLIBERO_DEBUG_KEY_ALIAS')
                keyPassword System.getenv('PASSOLIBERO_DEBUG_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            if (debugKeyPath) signingConfig signingConfigs.stableDebug
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
dependencies {
    // Libreria open source per OpenStreetMap. Nessuna API a pagamento.
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
}
