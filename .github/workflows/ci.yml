name: Verify Pull Request

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A fork PR is untrusted. Never grant write permission or expose signing secrets.
permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout proposed sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: JVM regression suite
        run: sh tests/run-core-tests.sh

      - name: SQLite migration preservation
        run: python3 tests/check-db-migration.py

      - name: Architecture dependency guard
        run: |
          python3 tests/check-architecture.py
          python3 -m unittest discover -s tests -p 'test_architecture.py'
          python3 -m unittest discover -s tests -p 'test_release_metadata.py'

      - name: Spotless formatting check
        run: sh ./gradlew --no-daemon :app:spotlessCheck

      - name: Android unit tests, APK and lint
        run: sh ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:lintDebug

      - name: Verify generated APK is installable on Android 11
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          min_sdk="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | sed -n "s/^sdkVersion:'\\([0-9]*\\)'.*/\\1/p")"
          echo "APK minSdk=$min_sdk, required <=30"
          [[ "$min_sdk" =~ ^[0-9]+$ ]] && (( min_sdk <= 30 ))

      - name: Preserve diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-diagnostics-${{ github.run_id }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  android11:
    name: android11
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout proposed sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run tests on Android 11 (API 30)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: sh ./gradlew --no-daemon :app:connectedDebugAndroidTest

      - name: Preserve Android 11 reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android11-diagnostics-${{ github.run_id }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 7
