name: PassoLibero - Genera APK Android

on:
  push:
    branches:
      - main
      - feature/passolibero-osm-v2
      - feature/v2-session-stats-tabs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: debug-signing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Compila PassoLibero
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      # 1. Scarica il repository
      - name: Recupera repository
        uses: actions/checkout@v4

      # 2. Estrae i sorgenti se sono ancora in uno ZIP
      - name: Estrai ZIP e pubblica i sorgenti
        shell: bash
        run: |
          set -euo pipefail

          archive="$(find . -maxdepth 1 -type f -iname '*PassoLibero*.zip' -print -quit)"

          if [[ -n "$archive" ]]; then
            mkdir -p .ci-extracted
            unzip -q "$archive" -d .ci-extracted

            if [[ -f .ci-extracted/settings.gradle ]]; then
              source_dir=.ci-extracted
            elif [[ -f .ci-extracted/PassoLibero/settings.gradle ]]; then
              source_dir=.ci-extracted/PassoLibero
            else
              echo "ERRORE: progetto Android non trovato nello ZIP"
              exit 1
            fi

            cp -a "$source_dir"/. .
            rm -rf .ci-extracted build-test

            # Mantiene il workflow bootstrap corrente
            rm -f .github/workflows/android-apk.yml

            git rm -f -- "$archive"
            git add -A

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            if ! git diff --cached --quiet; then
              git commit -m "Extract PassoLibero Android sources"
              git push origin "HEAD:$GITHUB_REF_NAME"
            fi
          fi

          test -f settings.gradle
          test -f app/build.gradle

      # 3. Configura Java
      - name: Installa Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Configura Android SDK senza il vecchio pacchetto tools
      - name: Configura Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      # 5. Installa Android 15 e gli strumenti di compilazione
      - name: Installa Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # 6. Configura Gradle
      - name: Installa Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 7. Esegue i test degli algoritmi
      - name: Esegui test algoritmici
        run: |
          sh tests/run-core-tests.sh
          python3 tests/check-db-migration.py
          python3 tests/check-weather-search.py

      - name: Prepara firma debug stabile
        shell: bash
        env:
          PASSOLIBERO_SIGNING_PASSPHRASE: ${{ secrets.PASSOLIBERO_SIGNING_PASSPHRASE }}
        run: bash ci/prepare-debug-signing.sh

      # 8. Compila l'applicazione Android
      - name: Compila APK debug
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      # 9. Verifica che l'APK sia stato generato
      - name: Verifica APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          if [[ "${PASSOLIBERO_SIGNED:-false}" == "true" ]]; then
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/apk-cert.txt"
            actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-cert.txt" | head -1)"
            expected="$(cat .github/signing/debug-cert.sha256)"
            if [[ -z "$actual" || "$actual" != "$expected" ]]; then
              echo "::error::Firma dell'APK diversa dal certificato debug persistente!"
              exit 1
            fi
            echo "Certificato debug verificato: $actual"
          fi

      # Canale aggiornamenti pubblico della PR #2, solo dopo firma e test.
      - name: Pubblica aggiornamento debug PR 2
        if: env.PASSOLIBERO_SIGNED == 'true' && github.ref_name == 'feature/v2-session-stats-tabs'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="debug-pr-2"
          version_code="$((10000 + GITHUB_RUN_NUMBER))"
          filename="passolibero-debug-v${version_code}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/$filename"
          export UPDATE_VERSION_CODE="$version_code" UPDATE_APK_NAME="$filename"
          export UPDATE_APK_SHA256="$(sha256sum "$RUNNER_TEMP/$filename" | cut -d' ' -f1)"
          export UPDATE_CERT_SHA256="$(cat .github/signing/debug-cert.sha256)"
          python3 - <<'PY'
          import json, os, pathlib
          payload = {
              "schema": 1,
              "channel": "debug-pr-2",
              "packageName": "it.example.passolibero",
              "versionCode": int(os.environ["UPDATE_VERSION_CODE"]),
              "apk": os.environ["UPDATE_APK_NAME"],
              "sha256": os.environ["UPDATE_APK_SHA256"],
              "certificateSha256": os.environ["UPDATE_CERT_SHA256"],
              "sourceCommit": os.environ["GITHUB_SHA"],
              "sourceBranch": os.environ["GITHUB_REF_NAME"]
          }
          pathlib.Path(os.environ["RUNNER_TEMP"], "update.json").write_text(
              json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "PassoLibero V2 - Debug PR #2" \
              --notes "Canale di sviluppo della PR #2. APK firmati; non e' una release stabile."
          fi
          # APK con nome univoco; update.json aggiornato per ultimo.
          gh release upload "$tag" "$RUNNER_TEMP/$filename" --repo "$GITHUB_REPOSITORY"
          gh release upload "$tag" "$RUNNER_TEMP/update.json" \
            --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
            --title "PassoLibero V2 - Debug PR #2 - build $GITHUB_RUN_NUMBER" \
            --notes "Build $GITHUB_RUN_NUMBER dalla PR #2 ($GITHUB_SHA). Sviluppo, non stabile."
          echo "Update debug pronto: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"

      # 10. Pubblica l'APK per il download
      - name: Pubblica APK
        if: env.PASSOLIBERO_SIGNED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: PassoLibero-Android15-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
